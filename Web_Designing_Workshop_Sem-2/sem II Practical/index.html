<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="calculator-card">
    <h2>Interest Calculator</h2>
    
    <div class="input-group">
        <label for="principal">Principal Amount ($)</label>
        <input type="number" id="principal" placeholder="Enter principal" min="0" step="any">
    </div>

    <div class="input-group">
        <label for="rate">Rate of Interest (% per year)</label>
        <input type="number" id="rate" placeholder="Enter annual interest rate" min="0" step="any">
    </div>

    <div class="input-group">
        <label for="time">Time Period (Years)</label>
        <input type="number" id="time" placeholder="Enter time in years" min="0" step="any">
    </div

    <button id="calculateBtn">Calculate</button>

    <div class="result-box" id="resultBox">
        <p>Simple Interest: <span id="interestResult">$0.00</span></p>
        <p>Total Amount: <span id="totalResult">$0.00</span></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
